[package]
name = "sankayi-intelligence"
version = "0.1.0"
edition = "2021"
description = "Sankayi Jazz Series analytics platform — Rust data service & REST API"
default-run = "sankayi-api"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-web-httpauth = "0.8"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "sankayi-api"
path = "src/main.rs"
